version: '3.1'
services:
  smartdata:
    image: postgres
    shm_size: '512m'
    container_name: smartgeodata-postgres
    ports:
      - '5435:5432'
    restart: always
    environment:
      - POSTGRES_DB=smartgeodata
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:
